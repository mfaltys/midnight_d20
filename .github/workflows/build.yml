name: Build firmware

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      # Builds both [env:*] in platformio.ini: the dice roller and the hardware
      # test. The environments are listed explicitly because platformio.ini sets
      # [platformio] default_envs = dice, so a bare `pio run` would build only the
      # dice roller. The env name is the program name, so
      # .pio/build/<name>/firmware.hex identifies which binary is which.
      - name: Build all environments
        run: pio run -e dice -e hwtest

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: midnight-d20-firmware
          path: .pio/build/*/firmware.hex
          if-no-files-found: error
