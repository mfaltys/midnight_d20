; Noctis Arcanum - ATtiny1614 d20 dice roller
;
; One PlatformIO environment per firmware program. The environment name selects
; which src/<name>/main.cpp is compiled (build_src_filter); without the filter
; every program's main.cpp is compiled into every binary and the link fails with
; "multiple definition of setup".
;
;   pio run -e dice     -> src/dice/     the dice roller application
;   pio run -e hwtest   -> src/hwtest/   LED + button hardware bring-up test
;
; Shared drivers (charlieplex LED driver, button handler) live in lib/ so both
; programs use exactly the same code paths.
;
; default_envs pins the "no environment given" workflows (a bare `pio run`,
; `pio run -t upload`, or the PlatformIO IDE toolbar buttons) to the dice roller.
; This matters: without it `pio run` processes EVERY [env:*] in definition order,
; so a bare upload flashes dice and then hwtest (defined last) over it, leaving
; the device running the LED walk / button test instead of the roller.

[platformio]
default_envs = dice

[env]
platform = atmelmegaavr@1.9.0
; PlatformIO derives the board ID from the platform manifest filename and matches
; it case-sensitively, so this must be exactly "ATtiny1614".
board = ATtiny1614
framework = arduino
upload_protocol = serialupdi
; BOD disabled: saves CR2032 sleep current, matching the rest of the design.
board_fuses.BODCFG = 0x00

; The core ships a naked PORTA ISR that dispatches through attachInterrupt()
; function pointers, and PlatformIO's atmelmegaavr Arduino framework builder
; already defines CORE_ATTACH_ALL, which suppresses it. That is what lets this
; firmware own ISR(PORTA_PORT_vect) directly (button wake-up) without a duplicate
; symbol; it is restated here so the intent is explicit and the build stays
; correct if the platform default ever changes.
build_flags = -DCORE_ATTACH_ALL

[env:dice]
build_src_filter = +<dice/>

[env:hwtest]
build_src_filter = +<hwtest/>
